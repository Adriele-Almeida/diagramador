<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatador & Diagramador de Texto</title>
    <!-- Importando Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importando fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* cinza claro */
        }
        
        /* Estilização da barra de rolagem para as áreas de texto */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animação suave para o toast de notificação */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
        }

        /* Estados visuais dos controles de formatação */
        .format-control,
        .multi-select-control {
            transition: none;
        }
        .format-icon {
            width: 100%;
            height: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .format-label {
            min-height: 0.75rem;
        }
        .format-control.is-selected,
        .format-control.is-selected:hover {
            border-color: #4f46e5;
            background-color: #4f46e5;
            color: #ffffff;
        }
        .format-control.is-dimmed,
        .format-control.is-dimmed:hover {
            border-color: #e2e8f0;
            background-color: #f1f5f9;
            color: #94a3b8;
        }
        .multi-select-control {
            border: 1px solid #e2e8f0;
            background-color: #f1f5f9;
            color: #94a3b8;
            box-shadow: none;
        }
        .multi-select-control.is-active,
        .multi-select-control.is-active:hover {
            border-color: #4f46e5;
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
        }
    </style>
    <meta property="og:title" content="Diagramador Inteligente">
    <meta property="og:description" content="Diagramação instantânea de textos.
Por Adriele Almeida • Estrategista Digital.">
    <meta property="og:image" content="miniatura.png">
    <link rel="icon" type="image/png" href="icone.png">
    <link rel="apple-touch-icon" href="icone.png">
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Controles fixos -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto h-14 px-4 sm:px-6 lg:px-8 flex flex-col justify-center">
            <h1 class="text-base sm:text-lg font-bold leading-tight text-black">Diagramador <span style="color: #4F46E5;">Inteligente</span></h1>
            <p class="mt-1 text-[11px] sm:text-xs leading-tight text-gray-500">por Adriele Almeida • Estrategista Digital</p>
        </div>
        <div class="max-w-7xl mx-auto h-20 px-4 sm:px-6 lg:px-8 flex items-center gap-1.5 sm:gap-2">
            <button type="button" data-format="clean_markdown" onclick="applyFormat('clean_markdown')" aria-label="Limpar Markdown" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-lg sm:text-xl font-bold">[ # ]</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Limpar Markdown</span>
            </button>
            <button type="button" data-format="uppercase" onclick="applyFormat('uppercase')" aria-label="Maiúsculo" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">ABC</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">MAIÚSCULO</span>
            </button>
            <button type="button" data-format="lowercase" onclick="applyFormat('lowercase')" aria-label="Minúsculo" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">abc</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">minúsculo</span>
            </button>
            <button type="button" data-format="titlecase" onclick="applyFormat('titlecase')" aria-label="Formato Título" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-lg sm:text-xl font-bold">Ttx</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Formato Título</span>
            </button>
            <button type="button" data-format="remove_underscores" onclick="applyFormat('remove_underscores')" aria-label="Remover Underline" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">a_b</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Remover Underline</span>
            </button>
            <button type="button" data-format="remove_emojis" onclick="applyFormat('remove_emojis')" aria-label="Remover Emojis" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-2xl sm:text-3xl font-bold">☺</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Remover Emojis</span>
            </button>
            <button id="multiSelectButton" type="button" onclick="toggleMultiSelect()" aria-label="Selecionar mais de uma função" aria-pressed="false" class="multi-select-control w-10 sm:w-12 shrink-0 h-16 flex items-center justify-center rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="text-3xl font-light leading-none">+</span>
            </button>
        </div>
    </header>

    <!-- Área Principal de Trabalho -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-6 lg:gap-8 h-full">
            
            <!-- Painel Esquerdo: Entrada -->
            <section class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Texto Original</h2>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="pasteFromClipboard()" class="flex items-center gap-1.5 text-xs font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 transition-colors px-3 py-1.5 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3h8"></path>
                                <path d="M9 3v2h6V3"></path>
                                <rect x="5" y="5" width="14" height="16" rx="2"></rect>
                                <path d="M9 11h6"></path>
                                <path d="M9 15h4"></path>
                            </svg>
                            Colar Texto
                        </button>
                        <button type="button" onclick="clearInput()" class="text-xs font-medium text-slate-500 hover:text-red-500 transition-colors px-2 py-1 rounded">
                            Limpar
                        </button>
                    </div>
                </div>
                <textarea 
                    id="inputText" 
                    class="flex-grow w-full p-5 resize-none outline-none focus:ring-0 text-slate-700 bg-transparent"
                    placeholder="Cole ou digite seu texto bruto aqui..."
                    style="min-height: 300px;"></textarea>
            </section>

            <!-- Painel Direito: Resultado -->
            <section class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Resultado Diagramado</h2>
                    
                    <!-- Botão de Copiar -->
                    <button onclick="copyToClipboard()" class="flex items-center gap-1.5 text-xs font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 transition-colors px-3 py-1.5 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copiar Texto
                    </button>
                </div>
                
                <textarea 
                    id="outputText" 
                    class="flex-grow w-full p-5 resize-none outline-none focus:ring-0 text-slate-800 bg-transparent"
                    placeholder="O texto formatado aparecerá aqui..."
                    style="min-height: 300px;"></textarea>
                    
                <!-- Estado vazio / Instrução overlay -->
                <div id="emptyState" class="absolute inset-0 top-12 flex flex-col items-center justify-center bg-white/90 pointer-events-none transition-opacity duration-300">
                    <svg class="text-slate-300 mb-3" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                    <p class="text-slate-400 text-sm font-medium text-center max-w-[250px]">Cole o texto acima e escolha uma função no topo.</p>
                </div>
            </section>

        </div>
    </main>

    <!-- Toast de Notificação (Invisível por padrão) -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-full opacity-0 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 z-50 pointer-events-none">
        <svg class="text-green-400" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="toastMessage" class="text-sm font-medium">Texto copiado!</span>
    </div>

    <script>
        // Referências aos elementos do DOM
        const inputEl = document.getElementById('inputText');
        const outputEl = document.getElementById('outputText');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const multiSelectButton = document.getElementById('multiSelectButton');
        let multiSelectMode = false;
        const selectedFormats = new Set();

        // Atualiza a prévia imediatamente ao digitar ou colar texto
        inputEl.addEventListener('input', updateOutputFromInput);

        function updateOutputFromInput() {
            const rawText = inputEl.value;
            outputEl.value = selectedFormats.size > 0
                ? applyFormats(rawText, Array.from(selectedFormats))
                : rawText;
            updateEmptyState();
        }

        function updateEmptyState() {
            if (outputEl.value.length > 0) {
                emptyState.style.opacity = '0';
            } else {
                emptyState.style.opacity = '1';
            }
        }

        // Função para limpar entrada
        function clearInput() {
            inputEl.value = '';
            outputEl.value = '';
            updateEmptyState();
        }

        /*
         * Lógica Central: Aplicador de Formato
         * No modo padrão aplica uma única função.
         * No modo de seleção múltipla aplica as funções marcadas, na ordem de seleção.
         */
        function applyFormat(type) {
            if (multiSelectMode) {
                if (selectedFormats.has(type)) {
                    selectedFormats.delete(type);
                } else {
                    selectedFormats.add(type);
                }
            } else {
                selectedFormats.clear();
                selectedFormats.add(type);
            }

            updateFormatButtons();
            updateOutputFromInput();
        }

        function toggleMultiSelect() {
            multiSelectMode = !multiSelectMode;

            if (!multiSelectMode) {
                selectedFormats.clear();
            }

            multiSelectButton.setAttribute('aria-pressed', String(multiSelectMode));
            multiSelectButton.classList.toggle('is-active', multiSelectMode);
            updateFormatButtons();
            updateOutputFromInput();
        }

        function updateFormatButtons() {
            document.querySelectorAll('[data-format]').forEach((button) => {
                const isSelected = selectedFormats.has(button.dataset.format);
                const isDimmed = multiSelectMode && !isSelected;
                button.classList.toggle('is-selected', isSelected);
                button.classList.toggle('is-dimmed', isDimmed);
                button.setAttribute('aria-pressed', String(isSelected));
            });
        }

        function applyFormats(text, formats) {
            return formats.reduce((formattedText, type) => {
                switch (type) {
                    case 'uppercase':
                        return formattedText.toUpperCase();
                    case 'lowercase':
                        return formattedText.toLowerCase();
                    case 'titlecase':
                        return formatTitleCase(formattedText);
                    case 'clean_markdown':
                        return cleanMarkdownCitations(formattedText);
                    case 'remove_emojis':
                        return removeEmojis(formattedText);
                    case 'remove_underscores':
                        return removeUnderscores(formattedText);
                    default:
                        return formattedText;
                }
            }, text);
        }

        /*
         * Lógica para Formato de Título
         * Palavras principais recebem inicial maiúscula.
         * Palavras de ligação (artigos, preposições, conjunções) permanecem minúsculas,
         * EXCETO se estiverem no início do texto ou após pontuação final (. ! ?).
         */
        function formatTitleCase(text) {
            // Lista abrangente de palavras menores no português (artigos, preposições, conjunções)
            const exceptions = [
                "a", "as", "o", "os", "um", "uma", "uns", "umas",
                "de", "do", "da", "dos", "das", 
                "em", "no", "na", "nos", "nas", 
                "por", "pelo", "pela", "pelos", "pelas", 
                "para", "com", "sem", "sob", "sobre", "ante", "até", "após",
                "e", "ou", "mas", "que", "se", "como", "nem", "pois",
                "ao", "aos", "à", "às"
            ];

            // Expressão regular para encontrar palavras (inclui acentos do Português)
            // A flag 'g' itera por todas as palavras encontradas
            return text.replace(/[a-zA-ZáàâãéèêíïóôõöúçñÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ]+/g, (match, offset, fullString) => {
                const wordLower = match.toLowerCase();

                // Pega a string que vem ANTES da palavra atual
                const precedingString = fullString.slice(0, offset);
                
                // Verifica se é o início de uma frase:
                // 1. Se a string anterior estiver vazia (início absoluto do texto)
                // 2. Se a string anterior terminar com pontuação de fim de frase seguida de espaços/quebras de linha
                const isSentenceStart = precedingString.trim() === "" || /[\.\!\?\;\:]\s*$/.test(precedingString);

                // Regra: Se é início de frase OU se NÃO está na lista de exceções -> Capitaliza
                if (isSentenceStart || !exceptions.includes(wordLower)) {
                    return wordLower.charAt(0).toUpperCase() + wordLower.slice(1);
                } else {
                    // É uma palavra de exceção no meio da frase -> Mantém minúscula
                    return wordLower;
                }
            });
        }

        /*
         * Lógica para Limpar Markdown e Citações
         * Remove os caracteres específicos de formatação e os números de referência.
         */
        function cleanMarkdownCitations(text) {
            let result = text;
            
            // 1. Remove referências de fontes tipo [1], [1, 2], [2-4] e [x].
            // A regex aceita números, vírgulas, espaços e hífens dentro dos colchetes.
            result = result.replace(/\s*\[([\d\s,–-]+|[a-zA-Z])\]/g, '');
            
            // 2. Remove os caracteres de markdown especificados (* e #)
            result = result.replace(/[#*]/g, '');

            // 3. Remove linhas usadas como separador horizontal em Markdown
            result = result.replace(/^[ \t]*---[ \t]*(?:\r?\n|$)/gm, '');
            
            // 4. Remove os espaços em branco que sobram no início de cada linha após remover os símbolos
            // (ex: "### 1." vira "   1.", e isso arruma para "1.")
            result = result.replace(/^[ \t]+/gm, '');
            
            return result;
        }

        /*
         * Remove emojis usando padrões Unicode, sem alterar os demais caracteres.
         */
        function removeEmojis(text) {
            return text.replace(/(?:[0-9#*]\uFE0F?\u20E3|\p{Regional_Indicator}{1,2}|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier}|\u200D\p{Extended_Pictographic})*)/gu, '');
        }

        /*
         * Troca cada underline por um espaço, preservando todo o restante do texto.
         */
        function removeUnderscores(text) {
            return text.replace(/_/g, ' ');
        }

        /*
         * Lógica de Colagem para Área de Transferência
         */
        async function pasteFromClipboard() {
            try {
                inputEl.value = await navigator.clipboard.readText();
                updateOutputFromInput();
                showToast("Texto colado com sucesso!");
            } catch (err) {
                console.error('Falha ao colar texto: ', err);
                showToast("Erro ao colar.", true);
            }
        }

        /*
         * Lógica de Cópia para Área de Transferência
         */
        async function copyToClipboard() {
            const textToCopy = outputEl.value;
            
            if (!textToCopy) {
                showToast("Não há texto para copiar.", true);
                return;
            }

            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast("Texto copiado com sucesso!");
            } catch (err) {
                console.error('Falha ao copiar texto: ', err);
                showToast("Erro ao copiar.", true);
            }
        }

        // Função para mostrar o Toast (notificação temporária na tela)
        let toastTimeout;
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            
            // Muda cor dependendo se é erro ou sucesso
            if(isError) {
                toast.classList.replace('bg-gray-900', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-900');
                toast.classList.replace('bg-gray-900', 'bg-gray-900'); // Garante estado base
            }

            // Exibe o toast
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';

            // Limpa o temporizador antigo se clicar rápido
            clearTimeout(toastTimeout);

            // Esconde após 3 segundos
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
            }, 3000);
        }
    </script>
</body>
</html>
