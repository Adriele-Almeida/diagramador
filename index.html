<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatador & Diagramador de Texto</title>
    <!-- Importando Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importando fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* cinza claro */
        }
        
        /* Estilização da barra de rolagem para as áreas de texto */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animação suave para o toast de notificação */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <!-- Ícone de Texto SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">TextFormat PRO</h1>
            </div>
            <p class="text-sm text-slate-500 hidden sm:block">Diagramação Rápida e Inteligente</p>
        </div>
    </header>

    <!-- Área Principal de Trabalho -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-6 lg:gap-8 h-full">
            
            <!-- Painel Esquerdo: Entrada -->
            <section class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Texto Original</h2>
                    <button onclick="clearInput()" class="text-xs font-medium text-slate-500 hover:text-red-500 transition-colors px-2 py-1 rounded">
                        Limpar
                    </button>
                </div>
                <textarea 
                    id="inputText" 
                    class="flex-grow w-full p-5 resize-none outline-none focus:ring-0 text-slate-700 bg-transparent"
                    placeholder="Cole ou digite seu texto bruto aqui..."
                    style="min-height: 300px;"></textarea>
            </section>

            <!-- Painel Central: Controles -->
            <section class="flex flex-row lg:flex-col justify-center items-center gap-3 lg:gap-4 shrink-0 flex-wrap">
                
                <!-- Opção 01: Caixa Alta -->
                <button onclick="applyFormat('uppercase')" class="group relative flex flex-col items-center justify-center w-32 h-20 lg:w-36 lg:h-24 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 text-slate-700 hover:text-indigo-700">
                    <span class="text-xl font-bold mb-1">ABC</span>
                    <span class="text-xs font-medium text-center px-2">TUDO MAIÚSCULO</span>
                </button>

                <!-- Opção 02: Título (Exceções) -->
                <button onclick="applyFormat('titlecase')" class="group relative flex flex-col items-center justify-center w-32 h-20 lg:w-36 lg:h-24 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 text-slate-700 hover:text-indigo-700">
                    <span class="text-xl font-bold mb-1">Abc De Fgh</span>
                    <span class="text-xs font-medium text-center px-2">Formato Título</span>
                    
                    <!-- Tooltip explicando a função -->
                    <div class="absolute lg:left-full lg:ml-2 bottom-full mb-2 lg:mb-0 lg:bottom-auto opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none w-48 bg-slate-800 text-white text-[10px] p-2 rounded shadow-lg z-20">
                        Primeira letra maiúscula, exceto: de, a, com, e, o, as, etc. (mantém minúsculas).
                    </div>
                </button>

                <!-- Opção 03: Tudo Minúsculo -->
                <button onclick="applyFormat('lowercase')" class="group relative flex flex-col items-center justify-center w-32 h-20 lg:w-36 lg:h-24 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 text-slate-700 hover:text-indigo-700">
                    <span class="text-xl font-bold mb-1">abc</span>
                    <span class="text-xs font-medium text-center px-2">tudo minúsculo</span>
                </button>

                <!-- Opção 04: Limpar Markdown & Fontes -->
                <button onclick="applyFormat('clean_markdown')" class="group relative flex flex-col items-center justify-center w-32 h-20 lg:w-36 lg:h-24 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 text-slate-700 hover:text-indigo-700">
                    <span class="text-lg font-bold mb-1 line-through text-slate-400 group-hover:text-indigo-400 transition-colors"># * [x]</span>
                    <span class="text-xs font-medium text-center px-2 leading-tight">Limpar<br>Markdown</span>
                    
                    <!-- Tooltip explicando a função -->
                    <div class="absolute lg:left-full lg:ml-2 bottom-full mb-2 lg:mb-0 lg:bottom-auto opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none w-48 bg-slate-800 text-white text-[10px] p-2 rounded shadow-lg z-20">
                        Remove marcações como asteriscos (*), hashtags (#) e citações de fontes ex: [1, 2] ou [x].
                    </div>
                </button>

            </section>

            <!-- Painel Direito: Resultado -->
            <section class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Resultado Diagramado</h2>
                    
                    <!-- Botão de Copiar -->
                    <button onclick="copyToClipboard()" class="flex items-center gap-1.5 text-xs font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 transition-colors px-3 py-1.5 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copiar Texto
                    </button>
                </div>
                
                <textarea 
                    id="outputText" 
                    class="flex-grow w-full p-5 resize-none outline-none focus:ring-0 text-slate-800 bg-transparent"
                    placeholder="O texto formatado aparecerá aqui..."
                    style="min-height: 300px;"></textarea>
                    
                <!-- Estado vazio / Instrução overlay -->
                <div id="emptyState" class="absolute inset-0 top-12 flex flex-col items-center justify-center bg-white/90 pointer-events-none transition-opacity duration-300">
                    <svg class="text-slate-300 mb-3" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                    <p class="text-slate-400 text-sm font-medium text-center max-w-[250px]">Cole o texto à esquerda e escolha um formato no centro.</p>
                </div>
            </section>

        </div>
    </main>

    <!-- Toast de Notificação (Invisível por padrão) -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-full opacity-0 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 z-50 pointer-events-none">
        <svg class="text-green-400" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="toastMessage" class="text-sm font-medium">Texto copiado!</span>
    </div>

    <script>
        // Referências aos elementos do DOM
        const inputEl = document.getElementById('inputText');
        const outputEl = document.getElementById('outputText');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Monitora digitação para esconder o estado vazio se já houver resultado
        inputEl.addEventListener('input', () => {
            if(inputEl.value.trim() === '') {
                outputEl.value = '';
                updateEmptyState();
            }
        });

        function updateEmptyState() {
            if (outputEl.value.length > 0) {
                emptyState.style.opacity = '0';
            } else {
                emptyState.style.opacity = '1';
            }
        }

        // Função para limpar entrada
        function clearInput() {
            inputEl.value = '';
            outputEl.value = '';
            updateEmptyState();
            inputEl.focus();
        }

        /* 
         * Lógica Central: Aplicador de Formato
         * Encaminha o texto para a função correta baseada no botão clicado.
         */
        function applyFormat(type) {
            const rawText = inputEl.value;
            
            if (!rawText.trim()) {
                showToast("Por favor, insira algum texto primeiro.", true);
                return;
            }

            let formattedText = "";

            switch (type) {
                case 'uppercase':
                    // Opção 01: Tudo em caixa alta
                    formattedText = rawText.toUpperCase();
                    break;
                case 'lowercase':
                    // Opção 03: Tudo minúsculo
                    formattedText = rawText.toLowerCase();
                    break;
                case 'titlecase':
                    // Opção 02: Formato de Título com Exceções
                    formattedText = formatTitleCase(rawText);
                    break;
                case 'clean_markdown':
                    // Opção 04: Limpar marcações de Markdown e Fontes
                    formattedText = cleanMarkdownCitations(rawText);
                    break;
            }

            // Define o resultado na área direita
            outputEl.value = formattedText;
            updateEmptyState();
        }

        /*
         * Lógica para Formato de Título
         * Palavras principais recebem inicial maiúscula.
         * Palavras de ligação (artigos, preposições, conjunções) permanecem minúsculas,
         * EXCETO se estiverem no início do texto ou após pontuação final (. ! ?).
         */
        function formatTitleCase(text) {
            // Lista abrangente de palavras menores no português (artigos, preposições, conjunções)
            const exceptions = [
                "a", "as", "o", "os", "um", "uma", "uns", "umas",
                "de", "do", "da", "dos", "das", 
                "em", "no", "na", "nos", "nas", 
                "por", "pelo", "pela", "pelos", "pelas", 
                "para", "com", "sem", "sob", "sobre", "ante", "até", "após",
                "e", "ou", "mas", "que", "se", "como", "nem", "pois",
                "ao", "aos", "à", "às"
            ];

            // Expressão regular para encontrar palavras (inclui acentos do Português)
            // A flag 'g' itera por todas as palavras encontradas
            return text.replace(/[a-zA-ZáàâãéèêíïóôõöúçñÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ]+/g, (match, offset, fullString) => {
                const wordLower = match.toLowerCase();

                // Pega a string que vem ANTES da palavra atual
                const precedingString = fullString.slice(0, offset);
                
                // Verifica se é o início de uma frase:
                // 1. Se a string anterior estiver vazia (início absoluto do texto)
                // 2. Se a string anterior terminar com pontuação de fim de frase seguida de espaços/quebras de linha
                const isSentenceStart = precedingString.trim() === "" || /[\.\!\?\;\:]\s*$/.test(precedingString);

                // Regra: Se é início de frase OU se NÃO está na lista de exceções -> Capitaliza
                if (isSentenceStart || !exceptions.includes(wordLower)) {
                    return wordLower.charAt(0).toUpperCase() + wordLower.slice(1);
                } else {
                    // É uma palavra de exceção no meio da frase -> Mantém minúscula
                    return wordLower;
                }
            });
        }

        /*
         * Lógica para Limpar Markdown e Citações
         * Remove os caracteres específicos de formatação e os números de referência.
         */
        function cleanMarkdownCitations(text) {
            let result = text;
            
            // 1. Remove referências de fontes tipo [1], [1, 2], [x], etc.
            // A regex procura por espaços opcionais seguidos de colchetes contendo números/vírgulas/espaços OU uma única letra.
            result = result.replace(/\s*\[([\d\s,]+|[a-zA-Z])\]/g, '');
            
            // 2. Remove os caracteres de markdown especificados (* e #)
            result = result.replace(/[#*]/g, '');
            
            // 3. Remove os espaços em branco que sobram no início de cada linha após remover os símbolos
            // (ex: "### 1." vira "   1.", e isso arruma para "1.")
            result = result.replace(/^[ \t]+/gm, '');
            
            return result;
        }

        /*
         * Lógica de Cópia para Área de Transferência
         */
        function copyToClipboard() {
            const textToCopy = outputEl.value;
            
            if (!textToCopy) {
                showToast("Não há texto para copiar.", true);
                return;
            }

            // Seleciona o texto visualmente para feedback (opcional)
            outputEl.select();
            outputEl.setSelectionRange(0, 99999); // Para dispositivos móveis

            // Utilizando o método seguro de cópia requerido para compatibilidade com iframes
            try {
                document.execCommand('copy');
                showToast("Texto copiado com sucesso!");
                // Remove a seleção visual após copiar
                window.getSelection().removeAllRanges();
            } catch (err) {
                console.error('Falha ao copiar texto: ', err);
                showToast("Erro ao copiar. Tente selecionar manualmente.", true);
            }
        }

        // Função para mostrar o Toast (notificação temporária na tela)
        let toastTimeout;
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            
            // Muda cor dependendo se é erro ou sucesso
            if(isError) {
                toast.classList.replace('bg-gray-900', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-900');
                toast.classList.replace('bg-gray-900', 'bg-gray-900'); // Garante estado base
            }

            // Exibe o toast
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';

            // Limpa o temporizador antigo se clicar rápido
            clearTimeout(toastTimeout);

            // Esconde após 3 segundos
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
            }, 3000);
        }
    </script>
</body>
</html>
