<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramador</title>
    <!-- Importando Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importando fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* cinza claro */
        }
        
        /* Estilização da barra de rolagem para as áreas de texto */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animação suave para o toast de notificação */
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
        }

        /* Estados visuais dos controles de formatação */
        .format-control,
        .multi-select-control {
            transition: none;
        }
        .format-icon {
            width: 100%;
            height: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .format-label {
            min-height: 0.75rem;
        }
        .format-control.is-selected,
        .format-control.is-selected:hover {
            border-color: #4f46e5;
            background-color: #4f46e5;
            color: #ffffff;
        }
        .format-control.is-dimmed,
        .format-control.is-dimmed:hover {
            border-color: #e2e8f0;
            background-color: #f1f5f9;
            color: #94a3b8;
        }
        .multi-select-control {
            border: 1px solid #e2e8f0;
            background-color: #f1f5f9;
            color: #94a3b8;
            box-shadow: none;
        }
        .clear-control {
            border: 1px solid #e2e8f0;
            background-color: #f1f5f9;
            color: #94a3b8;
            box-shadow: none;
        }
        /* Voltar: sempre apagado (cinza), nunca marcado; borda tracejada e fundo branco para diferenciar do Limpar. */
        .back-control,
        .back-control:hover,
        .back-control:focus,
        .back-control:active {
            border: 1px dashed #cbd5e1;
            background-color: #ffffff;
            color: #94a3b8;
            box-shadow: none;
            filter: none;
            -webkit-tap-highlight-color: transparent;
        }
        .multi-select-control.is-active,
        .multi-select-control.is-active:hover {
            border-color: #4f46e5;
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
        }
    
        /* No celular, a barra fica à esquerda e a página mantém a rolagem vertical. */
        @media (max-width: 767px) {
            /* Só a página rola (sem rolagem dentro de rolagem), o que evita o scroll travado no celular. */
            html,
            body {
                height: auto !important;
                min-height: 100%;
                overflow: visible !important;
            }
            body {
                overflow-x: clip !important;
            }

            body {
                display: block;
            }

            /* Menu lateral integrado ao layout: alinhado ao topo dos painéis e rola com a página. */

            #formatToolbar {
                position: absolute;
                top: calc(2rem - 0.2rem); /* alinha o 1º botão ao topo dos painéis (py-8 da área principal) */
                left: calc(-5.25rem + 0.35rem);
                right: auto;
                width: 4.6rem;
                max-width: none;
                margin: 0;
                height: auto !important;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0.4rem;
                padding: 0.2rem;
                background: transparent;
                z-index: 1;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            #formatToolbar > button {
                width: 100%;
                min-width: 0;
                height: 4rem;
                flex: none;
                padding: 0.2rem;
            }

            #formatToolbar .format-icon {
                height: 1.75rem;
                font-size: 1.3rem;
            }

            #formatToolbar > #backButton {
                height: 52px;
            }

            /* Botão Voltar: sem estado de foco/ativo preso após o toque. */
            #backButton {
                -webkit-tap-highlight-color: transparent;
            }
            #backButton:focus:not(:focus-visible) {
                outline: none;
                box-shadow: none;
            }


            #formatToolbar .format-icon svg {
                width: 24px;
                height: 24px;
            }

            #formatToolbar .format-label {
                margin-top: 0.25rem;
                font-size: 9px;
                line-height: 1.1;
            }

            main {
                position: relative;
                width: calc(100% - 5.25rem) !important;
                max-width: none !important;
                height: auto !important;
                min-height: 0;
                margin-left: 5.25rem !important;
                margin-right: 0 !important;
                padding: 1rem 0.5rem 2rem;
                overflow: visible !important;
                flex: none;
            }

            main > div {
                height: auto !important;
                min-height: 0;
                gap: 1rem;
            }

            /* Blocos de texto ocupam a mesma altura da coluna de botões (do primeiro ao último). */
            main > div {
                min-height: var(--toolbar-h, auto) !important;
            }

            main > div > section {
                flex: 1 1 0;
                min-width: 0;
                min-height: min(24rem, 60vh);
            }

            main section > div:first-child h2 {
                font-size: .875rem;
            }

            main section > div:first-child .btn-label {
                display: none;
            }

            main section > div:first-child button svg {
                width: 18px;
                height: 18px;
            }

            main section > textarea {
                height: auto;
                min-height: 18rem !important;
                overflow-y: auto;
                overscroll-behavior: auto;
                touch-action: pan-y;
            }
        }
    </style>
    <meta property="og:title" content="Diagramador Inteligente">
    <meta property="og:description" content="Diagramação instantânea de textos.
Por Adriele Almeida • Estrategista Digital.">
    <meta property="og:image" content="miniatura.png">
    <link rel="icon" type="image/png" href="icone.png">
    <link rel="apple-touch-icon" href="icone.png">
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Controles fixos -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto h-14 px-4 sm:px-6 lg:px-8 flex flex-col justify-center" style="background-color: #4F46E5;">
            <h1 class="text-xl sm:text-lg font-bold leading-tight text-white">Diagramador <span style="color: #E12AFF;">Inteligente</span></h1>
            <p class="mt-1 text-sm sm:text-xs leading-tight text-white">por Adriele Almeida • Estrategista Digital</p>
        </div>
        <div id="formatToolbar" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 grid grid-cols-4 lg:grid-cols-12 items-center gap-1.5 sm:gap-2">
            <button type="button" data-format="clean_markdown" onclick="applyFormat('clean_markdown')" aria-label="Limpar Markdown" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-lg sm:text-xl font-bold">[ # ]</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Limpar Markdown</span>
            </button>
            <button type="button" data-format="uppercase" onclick="applyFormat('uppercase')" aria-label="Maiúsculo" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">ABC</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">MAIÚSCULO</span>
            </button>
            <button type="button" data-format="lowercase" onclick="applyFormat('lowercase')" aria-label="Minúsculo" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">abc</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">minúsculo</span>
            </button>
            <button type="button" data-format="titlecase" onclick="applyFormat('titlecase')" aria-label="Formato Título" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-lg sm:text-xl font-bold">Ttx</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Formato Título</span>
            </button>
            <button type="button" data-format="remove_underscores" onclick="applyFormat('remove_underscores')" aria-label="Remover Underline" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">a_b</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Remover Underline</span>
            </button>
            <button type="button" data-format="remove_emojis" onclick="applyFormat('remove_emojis')" aria-label="Remover Emojis" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-2xl sm:text-3xl font-bold">☺</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Remover Emojis</span>
            </button>
                        <button type="button" data-format="remove_em_dash" onclick="applyFormat('remove_em_dash')" aria-label="Remover travessões" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon text-xl sm:text-2xl font-bold">—</span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Remover</span>
            </button>
            <button type="button" data-format="replace_em_dash" onclick="applyFormat('replace_em_dash')" aria-label="Substituir travessão por hífen" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14"></path><path d="M12 7.5v8"></path><path d="M9 12.5l3 3 3-3"></path><path d="M10 21h4"></path></svg></span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Trocar</span>
            </button>
            <button type="button" data-format="isolate_urls" onclick="applyFormat('isolate_urls')" aria-label="Isolar URLs" class="format-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Isolar URL</span>
            </button>
            <button id="multiSelectButton" type="button" onclick="toggleMultiSelect()" aria-label="Selecionar mais de uma função" aria-pressed="false" class="multi-select-control w-10 sm:w-12 shrink-0 h-16 flex items-center justify-center rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="text-3xl font-light leading-none">+</span>
            </button>
            <button id="clearButton" type="button" onclick="handleClearClick()" aria-label="Limpar texto (toque duplo limpa também as marcações)" title="Limpar texto — toque duplo limpa também as marcações" style="touch-action: manipulation;" class="clear-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex flex-col items-center justify-center rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <span class="format-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                        <path d="M22 21H7"></path>
                        <path d="m5 11 9 9"></path>
                    </svg>
                </span>
                <span class="format-label mt-1 text-[7px] sm:text-[9px] font-semibold leading-none text-center">Limpar</span>
            </button>
            <button id="backButton" type="button" onclick="undoLast()" aria-label="Voltar (desfazer a última alteração)" title="Voltar" style="touch-action: manipulation;" class="back-control group flex-1 basis-0 min-w-0 h-16 px-1 py-2 flex items-center justify-center rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
            </button>
        </div>
    </header>

    <!-- Área Principal de Trabalho -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-6 lg:gap-8 h-full">
            
            <!-- Painel Esquerdo: Entrada -->
            <section class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Texto Original</h2>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="pasteFromClipboard()" aria-label="Colar texto" title="Colar texto" class="flex items-center gap-1.5 text-xs font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 transition-colors px-3 py-1.5 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3h8"></path>
                                <path d="M9 3v2h6V3"></path>
                                <rect x="5" y="5" width="14" height="16" rx="2"></rect>
                                <path d="M9 11h6"></path>
                                <path d="M9 15h4"></path>
                            </svg>
                            <span class="btn-label">Colar Texto</span>
                        </button>
                    </div>
                </div>
                <textarea 
                    id="inputText" 
                    class="flex-grow w-full p-5 resize-none outline-none focus:ring-0 text-slate-700 bg-transparent"
                    placeholder="Cole ou digite seu texto bruto aqui..."
                    style="min-height: 300px;"></textarea>
            </section>

            <!-- Painel Direito: Resultado -->
            <section class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="font-semibold text-slate-700">Resultado Diagramado</h2>
                    
                    <!-- Botão de Copiar -->
                    <button onclick="copyToClipboard()" aria-label="Copiar texto" title="Copiar texto" class="flex items-center gap-1.5 text-xs font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 transition-colors px-3 py-1.5 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span class="btn-label">Copiar Texto</span>
                    </button>
                </div>
                
                <textarea 
                    id="outputText" 
                    class="flex-grow w-full p-5 resize-none outline-none focus:ring-0 text-slate-800 bg-transparent"
                    placeholder="O texto formatado aparecerá aqui..."
                    style="min-height: 300px;"></textarea>
                    
                <!-- Estado vazio / Instrução overlay -->
                <div id="emptyState" class="absolute inset-0 top-12 flex flex-col items-center justify-center bg-white pointer-events-none transition-opacity duration-300">
                    <svg class="text-slate-300 mb-3" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </div>
            </section>

        </div>
    </main>

    <!-- Toast de Notificação (Invisível por padrão) -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-full opacity-0 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 z-50 pointer-events-none">
        <svg class="text-green-400" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="toastMessage" class="text-sm font-medium">Texto copiado!</span>
    </div>

    <script>
        // Referências aos elementos do DOM
        const inputEl = document.getElementById('inputText');
        const outputEl = document.getElementById('outputText');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const multiSelectButton = document.getElementById('multiSelectButton');
        let multiSelectMode = false;
        const selectedFormats = new Set();

        // Atualiza a prévia imediatamente ao digitar ou colar texto
        inputEl.addEventListener('input', updateOutputFromInput);

        function updateOutputFromInput() {
            const rawText = inputEl.value;
            outputEl.value = selectedFormats.size > 0
                ? applyFormats(rawText, Array.from(selectedFormats))
                : rawText;
            updateEmptyState();
        }

        function updateEmptyState() {
            if (outputEl.value.length > 0) {
                emptyState.style.opacity = '0';
            } else {
                emptyState.style.opacity = '1';
            }
        }

        // Função para limpar entrada
        function clearInput() {
            inputEl.value = '';
            outputEl.value = '';
            updateEmptyState();
        }

        // Borracha: toque simples limpa o texto; toque duplo limpa também as marcações
        let lastClearClick = 0;
        function handleClearClick() {
            const now = Date.now();
            if (now - lastClearClick >= 300) saveState();
            clearInput();
            if (now - lastClearClick < 300) {
                clearMarkings();
                lastClearClick = 0;
            } else {
                lastClearClick = now;
            }
        }

        // Voltar: desfaz a última alteração (texto, funções marcadas e "+").
        const backButton = document.getElementById('backButton');
        const undoStack = [];
        let lastTypingSnapshot = 0;
        function saveState() {
            undoStack.push({ text: inputEl.value, formats: [...selectedFormats], multi: multiSelectMode });
            if (undoStack.length > 50) undoStack.shift();
            updateBackButton();
        }
        // O Voltar fica sempre cinza (não acende roxo).
        function updateBackButton() {}
        function undoLast() {
            backButton.blur();
            const state = undoStack.pop();
            if (!state) return;
            inputEl.value = state.text;
            selectedFormats.clear();
            state.formats.forEach((f) => selectedFormats.add(f));
            multiSelectMode = state.multi;
            multiSelectButton.setAttribute('aria-pressed', String(multiSelectMode));
            multiSelectButton.classList.toggle('is-active', multiSelectMode);
            lastTypingSnapshot = 0;
            updateFormatButtons();
            updateOutputFromInput();
            updateBackButton();
        }
        inputEl.addEventListener('beforeinput', () => {
            const now = Date.now();
            if (now - lastTypingSnapshot > 1000) saveState();
            lastTypingSnapshot = now;
        });

        function clearMarkings() {
            selectedFormats.clear();
            multiSelectMode = false;
            multiSelectButton.setAttribute('aria-pressed', 'false');
            multiSelectButton.classList.remove('is-active');
            updateFormatButtons();
            updateOutputFromInput();
        }

        // No celular, o menu lateral fica dentro da área principal (não fixo); no computador, volta ao cabeçalho
        const formatToolbar = document.getElementById('formatToolbar');
        const toolbarHeader = formatToolbar.parentElement;
        const mainEl = document.querySelector('main');
        const mobileQuery = window.matchMedia('(max-width: 767px)');
        function placeToolbar() {
            if (mobileQuery.matches) {
                if (formatToolbar.parentElement !== mainEl) mainEl.prepend(formatToolbar);
            } else if (formatToolbar.parentElement !== toolbarHeader) {
                toolbarHeader.appendChild(formatToolbar);
            }
        }
        placeToolbar();

        // No celular: alinha a altura dos blocos de texto com a coluna de botões
        function syncLayout() {
            const holder = document.querySelector('main section').parentElement;
            if (mobileQuery.matches) {
                const first = formatToolbar.firstElementChild.getBoundingClientRect();
                const last = formatToolbar.lastElementChild.getBoundingClientRect();
                holder.style.setProperty('--toolbar-h', Math.round(last.bottom - first.top) + 'px');
            } else {
                holder.style.removeProperty('--toolbar-h');
            }
        }
        syncLayout();
        window.addEventListener('resize', syncLayout);
        window.addEventListener('load', syncLayout);
        if (mobileQuery.addEventListener) {
            mobileQuery.addEventListener('change', placeToolbar);
        } else {
            mobileQuery.addListener(placeToolbar);
        }

        /*
         * Lógica Central: Aplicador de Formato
         * No modo padrão aplica uma única função; tocar de novo no botão marcado desmarca.
         * No modo de seleção múltipla aplica as funções marcadas, na ordem de seleção.
         */
        function applyFormat(type) {
            saveState();
            if (multiSelectMode) {
                if (selectedFormats.has(type)) {
                    selectedFormats.delete(type);
                } else {
                    selectedFormats.add(type);
                }
            } else if (selectedFormats.has(type)) {
                selectedFormats.clear();
            } else {
                selectedFormats.clear();
                selectedFormats.add(type);
            }

            updateFormatButtons();
            updateOutputFromInput();
        }

        function toggleMultiSelect() {
            saveState();
            multiSelectMode = !multiSelectMode;

            if (!multiSelectMode) {
                selectedFormats.clear();
            }

            multiSelectButton.setAttribute('aria-pressed', String(multiSelectMode));
            multiSelectButton.classList.toggle('is-active', multiSelectMode);
            updateFormatButtons();
            updateOutputFromInput();
        }

        function updateFormatButtons() {
            document.querySelectorAll('[data-format]').forEach((button) => {
                const isSelected = selectedFormats.has(button.dataset.format);
                const isDimmed = multiSelectMode && !isSelected;
                button.classList.toggle('is-selected', isSelected);
                button.classList.toggle('is-dimmed', isDimmed);
                button.setAttribute('aria-pressed', String(isSelected));
            });
        }

        function applyFormats(text, formats) {
            return formats.reduce((formattedText, type) => {
                switch (type) {
                    case 'uppercase':
                        return formattedText.toUpperCase();
                    case 'lowercase':
                        return formattedText.toLowerCase();
                    case 'titlecase':
                        return formatTitleCase(formattedText);
                    case 'clean_markdown':
                        return cleanMarkdownCitations(formattedText);
                    case 'remove_emojis':
                        return removeEmojis(formattedText);
                    case 'remove_em_dash':
                        return removeEmDash(formattedText);
                    case 'replace_em_dash':
                        return replaceEmDash(formattedText);
                    case 'remove_underscores':
                        return removeUnderscores(formattedText);
                    case 'isolate_urls':
                        return isolateUrls(formattedText);
                    default:
                        return formattedText;
                }
            }, text);
        }

        /*
         * Lógica para Formato de Título
         * Palavras principais recebem inicial maiúscula.
         * Palavras de ligação (artigos, preposições, conjunções) permanecem minúsculas,
         * EXCETO se estiverem no início do texto ou após pontuação final (. ! ?).
         */
        function formatTitleCase(text) {
            // Lista abrangente de palavras menores no português (artigos, preposições, conjunções)
            const exceptions = [
                "a", "as", "o", "os", "um", "uma", "uns", "umas",
                "de", "do", "da", "dos", "das", 
                "em", "no", "na", "nos", "nas", 
                "por", "pelo", "pela", "pelos", "pelas", 
                "para", "com", "sem", "sob", "sobre", "ante", "até", "após",
                "e", "ou", "mas", "que", "se", "como", "nem", "pois",
                "ao", "aos", "à", "às"
            ];

            // Expressão regular para encontrar palavras (inclui acentos do Português)
            // A flag 'g' itera por todas as palavras encontradas
            return text.replace(/[a-zA-ZáàâãéèêíïóôõöúçñÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ]+/g, (match, offset, fullString) => {
                const wordLower = match.toLowerCase();

                // Pega a string que vem ANTES da palavra atual
                const precedingString = fullString.slice(0, offset);
                
                // Verifica se é o início de uma frase:
                // 1. Se a string anterior estiver vazia (início absoluto do texto)
                // 2. Se a string anterior terminar com pontuação de fim de frase seguida de espaços/quebras de linha
                const isSentenceStart = precedingString.trim() === "" || /[\.\!\?\;\:]\s*$/.test(precedingString);

                // Regra: Se é início de frase OU se NÃO está na lista de exceções -> Capitaliza
                if (isSentenceStart || !exceptions.includes(wordLower)) {
                    return wordLower.charAt(0).toUpperCase() + wordLower.slice(1);
                } else {
                    // É uma palavra de exceção no meio da frase -> Mantém minúscula
                    return wordLower;
                }
            });
        }

        /*
         * Lógica para Limpar Markdown e Citações
         * Remove os caracteres específicos de formatação e os números de referência.
         */
        function cleanMarkdownCitations(text) {
            let result = text;
            
            // 1. Remove referências de fontes tipo [1], [1, 2], [2-4] e [x].
            // A regex aceita números, vírgulas, espaços e hífens dentro dos colchetes.
            result = result.replace(/\s*\[([\d\s,–-]+|[a-zA-Z])\]/g, '');
            
            // 2. Remove os caracteres de markdown especificados (* e #)
            result = result.replace(/[#*]/g, '');

            // 3. Remove linhas usadas como separador horizontal em Markdown
            result = result.replace(/^[ \t]*---[ \t]*(?:\r?\n|$)/gm, '');
            
            // 4. Remove os espaços em branco que sobram no início de cada linha após remover os símbolos
            // (ex: "### 1." vira "   1.", e isso arruma para "1.")
            result = result.replace(/^[ \t]+/gm, '');
            
            return result;
        }

        /*
         * Remove emojis e ajusta apenas os espaços encostados neles:
         * mantém um espaço entre palavras e não deixa espaços nas bordas
         * nem antes de pontuação ou de uma quebra de linha.
         */
        function removeEmojis(text) {
            const emojiPattern = String.raw`(?:[0-9#*]\uFE0F?\u20E3|\p{Regional_Indicator}{1,2}|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier}|\u200D\p{Extended_Pictographic})*)`;
            const emojiRunPattern = new RegExp(`[ \\t]*${emojiPattern}(?:[ \\t]*${emojiPattern})*[ \\t]*`, 'gu');

            return text.replace(emojiRunPattern, (match, offset, fullText) => {
                const before = fullText[offset - 1] || '';
                const after = fullText[offset + match.length] || '';
                const hasTextOnBothSides = before && after
                    && !/[ \t\r\n]/.test(before)
                    && !/[\s,.;:!?%)\]}»”’]/u.test(after);

                return hasTextOnBothSides && /[ \t]/.test(match) ? ' ' : '';
            });
        }

        /*
         * Remove exclusivamente o caractere travessão (—).
         */
        function removeEmDash(text) {
            return text.replace(/—/g, '');
        }

        /*
         * Substitui exclusivamente o travessão (—) pelo hífen (-).
         */
        function replaceEmDash(text) {
            return text.replace(/—/g, '-');
        }
        /*
         * Isolador de URLs: devolve só as URLs digitadas no texto, uma por linha.
         * A URL vai do http(s):// até o próximo espaço, aspas, crase ou < >.
         * Pontuação de fim de frase colada no final é deixada de fora.
         */
        function isolateUrls(text) {
            const found = text.match(/https?:\/\/[^\s"'`<>]+/gi) || [];
            return found.map(trimUrlEnd).filter(Boolean).join('\n');
        }

        function trimUrlEnd(url) {
            const pairs = { ')': '(', ']': '[', '}': '{' };
            let changed = true;
            while (changed && url.length) {
                changed = false;
                const last = url[url.length - 1];
                if ('.,;:!?*'.includes(last)) {
                    url = url.slice(0, -1);
                    changed = true;
                } else if (pairs[last]) {
                    const opens = url.split(pairs[last]).length - 1;
                    const closes = url.split(last).length - 1;
                    if (closes > opens) {
                        url = url.slice(0, -1);
                        changed = true;
                    }
                }
            }
            return url;
        }

        /*
         * Troca cada underline por um espaço, preservando todo o restante do texto.
         */
        function removeUnderscores(text) {
            return text.replace(/_/g, ' ');
        }

        /*
         * Lógica de Colagem para Área de Transferência
         */
        async function pasteFromClipboard() {
            try {
                const pasted = await navigator.clipboard.readText();
                saveState();
                inputEl.value = pasted;
                updateOutputFromInput();
                showToast("Texto colado com sucesso!");
            } catch (err) {
                console.error('Falha ao colar texto: ', err);
                showToast("Erro ao colar.", true);
            }
        }

        /*
         * Lógica de Cópia para Área de Transferência
         */
        async function copyToClipboard() {
            const textToCopy = outputEl.value;
            
            if (!textToCopy) {
                showToast("Não há texto para copiar.", true);
                return;
            }

            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast("Texto copiado com sucesso!");
            } catch (err) {
                console.error('Falha ao copiar texto: ', err);
                showToast("Erro ao copiar.", true);
            }
        }

        // Função para mostrar o Toast (notificação temporária na tela)
        let toastTimeout;
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            
            // Muda cor dependendo se é erro ou sucesso
            if(isError) {
                toast.classList.replace('bg-gray-900', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-900');
                toast.classList.replace('bg-gray-900', 'bg-gray-900'); // Garante estado base
            }

            // Exibe o toast
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';

            // Limpa o temporizador antigo se clicar rápido
            clearTimeout(toastTimeout);

            // Esconde após 3 segundos
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
            }, 3000);
        }
    </script>
</body>
